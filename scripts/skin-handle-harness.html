<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>skin-handle-harness — #34 P1' 验证（不依赖 WebGL）</title>
<style>body{font:13px/1.5 monospace;background:#111;color:#ddd;padding:16px}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">running...</pre>
<script>
/* 最小 Scratch API mock：只为加载 cropURL / lmsSkins 两个扩展并驱动其逻辑。
   不创建 WebGL 上下文——createBitmapSkin 被替换为记录器，验证「交出的是什么」。 */
const skins = [];
window.__created = [];
window.Scratch = {
  vm: {
    runtime: {
      isPackaged: false,
      targets: [],
      on: () => {}, off: () => {}, once: () => {}, emit: () => {},
      addListener: () => {}, removeListener: () => {},
      getTargets: () => [],
      renderer: {
        _allSkins: {},
        _allDrawables: [],
        createBitmapSkin: (image, rotationCenter) => {
          const id = skins.length;
          skins.push({ image, rotationCenter });
          window.__created.push({
            type: image && image.constructor ? image.constructor.name : typeof image,
            w: image && image.width, h: image && image.height,
            rotationCenter: rotationCenter === undefined ? null : rotationCenter,
          });
          return id;
        },
        createSVGSkin: () => 0,
      },
      getSpriteTargetByName: () => null,
      getTargetForStage: () => null,
    },
  },
  Cast: {
    toString: (v) => String(v),
    toNumber: (v) => Number(v),
    toBoolean: (v) => !!v,
    toListIndex: () => 0,
    isWhiteSpace: () => false,
  },
  translate: Object.assign(function (s) { return s; }, { setup: () => {}, language: 'zh-cn' }),
  extensions: {
    register: (ext) => { window.__exts = window.__exts || []; window.__exts.push(ext); },
    unsandboxed: false,
  },
  canFetch: async () => true,
  fetch: async () => ({ headers: { get: () => 'image/png' }, arrayBuffer: async () => new ArrayBuffer(0) }),
  BlockType: new Proxy({}, { get: (_, k) => k }),
  ArgumentType: new Proxy({}, { get: (_, k) => k }),
  TargetType: new Proxy({}, { get: (_, k) => k }),
};
</script>
<script src="../extensions/00-cropURL.js"></script>
<script src="../extensions/06-lmsSkins.js"></script>
<script>
(async () => {
  const out = [];
  const log = (s) => { out.push(s); document.getElementById('out').textContent = out.join('\n'); };

  const exts = window.__exts || [];
  log('扩展注册数: ' + exts.length);
  const cropExt = exts.find(e => e.getInfo && e.getInfo().id === 'cropURL');
  const skinExt = exts.find(e => e.getInfo && e.getInfo().id === 'lmsSkins');
  log('cropURL: ' + !!cropExt + '  lmsSkins: ' + !!skinExt);
  if (!cropExt || !skinExt) { window.__result = { ok: false, reason: 'ext not registered' }; return; }

  // 造一张 800x800 源图（模拟项目里的大壁纸/界面图）
  const src = document.createElement('canvas');
  src.width = 800; src.height = 800;
  const c = src.getContext('2d');
  const g = c.createLinearGradient(0, 0, 800, 800);
  g.addColorStop(0, '#2b6cb0'); g.addColorStop(1, '#e53e3e');
  c.fillStyle = g; c.fillRect(0, 0, 800, 800);
  for (let i = 0; i < 120; i++) {
    c.fillStyle = 'rgba(255,255,255,.18)';
    c.fillRect(Math.random() * 800, Math.random() * 800, 30, 30);
  }
  const srcURL = src.toDataURL('image/png');

  // ---- 1. crop 返回值形态 ----
  const t0 = performance.now();
  const token = await cropExt.crop({ URL: srcURL, X: 100, Y: 100, W: 300, H: 300, UNIT: 'px', R: 0, FMT: 'png', Q: 0.92 });
  const t1 = performance.now();
  log(`\ncrop() 单次: ${(t1 - t0).toFixed(2)}ms  → 返回: ${String(token).slice(0, 40)}...`);
  const isHandle = typeof token === 'string' && token.indexOf('skin://') === 0;
  log('句柄模式: ' + isHandle);

  // ---- 2. 句柄表内容 ----
  const h = window.__pixelSkinHandles;
  const held = isHandle && h && h.map ? h.map.get(token) : null;
  log(`句柄表命中: ${!!held}  类型: ${held ? held.constructor.name : '-'}  尺寸: ${held ? held.width + 'x' + held.height : '-'}`);
  log('期望尺寸 600x600（W300*2 超采样）: ' + (held && held.width === 600 && held.height === 600));

  // ---- 3. registerURLSkin 消费句柄 ----
  const n0 = window.__created.length;
  await skinExt._createURLSkin(token);
  const made = window.__created.slice(n0);
  log(`\n_createURLSkin 产出 skin 数: ${made.length}`);
  if (made.length) {
    log(`  image 类型: ${made[0].type}  尺寸: ${made[0].w}x${made[0].h}`);
    log('  尺寸正确(600x600): ' + (made[0].w === 600 && made[0].h === 600));
  }
  log('句柄消费后已移除: ' + (isHandle ? !h.map.has(token) : 'n/a'));

  // ---- 4. 671 次端到端（crop + register）墙钟 ----
  const N = 60;                       // 抽样 60 次，×11 外推 671
  const wall0 = performance.now();
  for (let i = 0; i < N; i++) {
    const tk = await cropExt.crop({ URL: srcURL, X: (i * 3) % 400, Y: (i * 7) % 400, W: 200, H: 300, UNIT: 'px', R: 0, FMT: 'png', Q: 0.92 });
    await skinExt._createURLSkin(tk);
  }
  const wall = (performance.now() - wall0) / N;
  log(`\n端到端 ${N} 次: 平均 ${wall.toFixed(2)}ms/帧  → 671 帧 ${(wall * 671 / 1000).toFixed(1)}s（低端×4: ${(wall * 671 * 4 / 1000).toFixed(0)}s）`);

  window.__result = {
    ok: true, mode: isHandle ? 'handle' : 'dataurl',
    crop_ms: +(t1 - t0).toFixed(2), e2e_ms_per_frame: +wall.toFixed(2),
    projected_671_s: +(wall * 671 / 1000).toFixed(1),
    handle_consumed: isHandle ? !h.map.has(token) : null,
    size_ok: !!(made[0] && made[0].w === 600 && made[0].h === 600),
  };
  log('\nRESULT: ' + JSON.stringify(window.__result));
})();
</script>
</body>
</html>
