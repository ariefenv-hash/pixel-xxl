<!DOCTYPE html>
<!-- shell-src/index.html — Pixel XXL 新壳入口（#23 结构性混合渲染）
     Vite 入口；构建产物输出到仓库根 shell/（Pages 双入口之二：/pixel-xxl/shell/）。

     架构（docs/SHELL.md）：iframe 原样嵌根入口——运行时（lib 三件套 + 启动序列）
     零复制零重写，根入口行为 100% 保真；壳层 DOM（QS 面板 / 状态胶囊）以
     pointer-events 分层叠加（qs-root none / 可交互子元素 auto），
     未接管的指针事件自然穿透给 iframe 内 Canvas。
     桥接面见 src/bridge/runtime.ts（读通道 + 写通道 VMBridge 收敛）。

     URL 参数透传：location.search 原样拼给 iframe（?nofb=1 回归豁免通道
     在 iframe 内的根入口生效，shell 层自身无反馈层，双版像素对比不受污染）。
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel XXL · Shell</title>
  <script type="module" crossorigin src="./assets/index-C1rmM9c4.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BBvFC4nv.css">
</head>
<body>
  <iframe id="runtime" src="../index.html" title="Pixel XXL 运行时（根入口原样嵌入）"></iframe>
  <div id="qs-root"></div>
  <div id="bridge-status" data-level="ok" hidden>桥接初始化中…</div>
  <noscript>Enable JavaScript</noscript>
  <script>
    // URL 参数透传（?nofb=1 等）——壳层自身不产生反馈层，豁免通道语义与根入口一致
    (function () {
      var s = location.search;
      if (s) {
        var f = document.getElementById('runtime');
        f.setAttribute('src', '../index.html' + s);
      }
    })();
  </script>
</body>
</html>
