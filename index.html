<script>
    const run = async () => {
      // v1.06: 加载屏状态文案——轮询 loader 的 __packState()，区分
      // 「首次下载中 X% / 本地素材库载入 / 逐文件兜底 / 解码中」四态，
      // 并为素材解码段（进度条 0.75→1.0，vm 内部解码、无细分进度事件）给出诚实预期
      var noteEl = document.getElementById('loading-note');
      var setNote = function (t) { if (noteEl) noteEl.textContent = t; };
      setNote('正在准备素材…');
      var noteTimer = setInterval(function () {
        var st = null;
        try { st = window.__packState ? window.__packState() : null; } catch (e) {}
        if (!st) return;
        if (st.ready) {
          // v1.08: 包就绪后展示真实解码进度（assetLoaded/assetTotal），
          // 解码完后进入构建桌面长尾段（vm.loadProject，无细分事件）
          var a = st.assets || null;
          if (a && a.total > 0 && a.loaded < a.total) {
            setNote((st.source === 'idb' ? '已从本地素材库载入素材包，' : '素材包就绪，') +
              '解码素材 ' + Math.min(100, Math.round(a.loaded / a.total * 100)) + '%…');
          } else {
            clearInterval(noteTimer);
            setNote(st.source === 'idb'
              ? '已从本地素材库载入素材包，正在构建桌面…'
              : '素材包就绪，正在构建桌面…');
          }
        } else if (st.failed) {
          clearInterval(noteTimer);
          setNote('正在加载素材（逐文件模式，稍慢）…');
        } else if (st.total > 0) {
          var pct = Math.min(100, Math.round(st.loaded / st.total * 100));
          setNote('首次进入需要下载素材包（约 22 MB），完成后会保存在本地，再次进入无需重复下载… ' + pct + '%');
        }
      }, 400);
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      clearInterval(noteTimer);
      setProgress(1);
      loadingScreen.hidden = true;
      if (false) {
        scaffolding.start();
      } else {
        launchScreen.hidden = false;
        launchScreen.addEventListener('click', () => {
          launchScreen.hidden = true;
          scaffolding.start();
        });
        launchScreen.focus();
      }
    };
    run().catch(handleError);
  </script>
  <script>

  </script>
  <script>
    // v1.06: 启动屏进度反馈层（docs/MOBILE.md §三④ 修复路线完整版）
    // 数据源双通道：真实变量「渲染的进度/渲染数」（v1.05 对侧并行实例贡献——修正
    // v1.02「门控无出口」误判，window.vm 全局可读零红线，优先）+ 运行时阶段推断兜底；
    // 收层五通道：像素点亮 / 进度满~4s / 保守放行 / 180s 硬封顶 / #error 立即收层。
    // 痛点：点击绿旗后进入运行时编译/软渲染空窗（低端设备实测约 144 秒，docs/MOBILE.md §二），
    //       屏幕全黑零反馈，用户体感「黑屏点不动」。
    // 方案：纯追加观察层——不改动上方任何既有字节（core/app 逐字节红线不动）：
    //       MutationObserver 捕获 #launch 隐藏瞬间叠加反馈层；watchdog 每秒轮询
    //       外部可观察信号（window.vm 出现 → targets 装载 → _tickCounter 增长 →
    //       canvas 像素点亮）更新阶段文案；画面点亮自动收层。
    // 回归兼容：URL 带 ?nofb=1 时不安装——双版像素对比回归（scripts/regression-headless.py）
    //           走此通道，保持与 v1.03 完全一致的逐字节行为；
    //           检测到 #error 屏显示即立即收层（错误信息优先展示）。
    (function () {
      if (window.__bootFeedbackInstalled) return;
      if (/[?&]nofb([=&]|$)/.test(location.search)) return;
      window.__bootFeedbackInstalled = true;

      var launch = document.getElementById('launch');
      var loading = document.getElementById('loading');
      var errorScreen = document.getElementById('error');

      var fb = document.createElement('div');
      fb.id = 'boot-feedback';
      fb.setAttribute('role', 'status');
      fb.setAttribute('aria-live', 'polite');
      fb.setAttribute('hidden', '');
      fb.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000000;display:flex;' +
        'flex-direction:column;align-items:center;justify-content:center;text-align:center;' +
        'font-family:sans-serif;color:#ffffff;user-select:none;-webkit-user-select:none;' +
        'cursor:default;padding:24px;box-sizing:border-box;';

      var title = document.createElement('div');
      title.textContent = 'Pixel XXL';
      title.style.cssText = 'font-size:28px;font-weight:300;margin:0 0 18px;letter-spacing:1px;';
      var phase = document.createElement('div');
      phase.style.cssText = 'font-size:15px;opacity:.85;margin:0 0 10px;min-height:20px;';
      phase.textContent = '准备启动…';
      var elapsed = document.createElement('div');
      elapsed.style.cssText = 'font-size:13px;opacity:.5;margin:0 0 18px;min-height:16px;';
      var bar = document.createElement('div');
      bar.style.cssText = 'width:200px;max-width:60vw;height:4px;border-radius:2px;' +
        'background:rgba(255,255,255,.18);overflow:hidden;';
      var barInner = document.createElement('div');
      barInner.style.cssText = 'height:100%;width:0;background:#ff4c4c;border-radius:2px;transition:width .6s linear;';
      bar.appendChild(barInner);
      var dots = document.createElement('div');
      dots.style.cssText = 'display:flex;gap:8px;margin-top:18px;';
      for (var i = 0; i < 3; i++) {
        var d = document.createElement('span');
        d.style.cssText = 'width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);' +
          'animation:bfbPulse 1.2s ' + (i * 0.2) + 's ease-in-out infinite;';
        dots.appendChild(d);
      }
      var hint = document.createElement('div');
      hint.style.cssText = 'font-size:12px;opacity:.45;margin-top:16px;max-width:340px;line-height:1.6;display:none;';
      fb.appendChild(title);
      fb.appendChild(phase);
      fb.appendChild(elapsed);
      fb.appendChild(bar);
      fb.appendChild(dots);
      fb.appendChild(hint);

      var style = document.createElement('style');
      style.textContent =
        '@keyframes bfbPulse{0%,100%{opacity:.25}50%{opacity:.9}}' +
        '#boot-feedback[hidden]{display:none!important;}';
      document.head.appendChild(style);
      document.body.appendChild(fb);

      var t0 = 0, timer = null, litStreak = 0, fullStreak = 0, runningSeen = false, pixelBroken = false;
      var sampleCanvas = document.createElement('canvas');
      sampleCanvas.width = 64;
      sampleCanvas.height = 48;
      var sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });

      function getStageCanvas() {
        return document.querySelector('#app canvas');
      }
      // 返回 0~1 非黑像素占比；canvas 未就绪或检测通道不可用返回 null
      function litRatio() {
        var c = getStageCanvas();
        if (!c || !c.width || !c.height) return null;
        try {
          sctx.clearRect(0, 0, 64, 48);
          sctx.drawImage(c, 0, 0, 64, 48);
          var px = sctx.getImageData(0, 0, 64, 48).data;
          var lit = 0, total = 64 * 48;
          for (var i = 0; i < px.length; i += 4) {
            if (px[i] > 16 || px[i + 1] > 16 || px[i + 2] > 16) lit++;
          }
          return lit / total;
        } catch (e) {
          pixelBroken = true;
          return null;
        }
      }
      // 真实进度数据源（运行时 Scratch 变量，对侧 v1.05 贡献）
      function readVar(name) {
        try {
          if (!window.vm || !vm.runtime) return null;
          var stage = vm.runtime.getTargetForStage();
          if (!stage || !stage.variables) return null;
          for (var k in stage.variables) {
            var v = stage.variables[k];
            if (v && v.name === name) return v.value;
          }
        } catch (e) {}
        return null;
      }
      function fmt(sec) {
        return sec < 60 ? ('已启动 ' + sec + ' 秒') : ('已启动 ' + Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒');
      }
      function setPhase(text, pct) {
        if (phase.textContent !== text) phase.textContent = text;
        if (pct != null) barInner.style.width = pct + '%';
      }
      function showHint(sec) {
        if (sec > 150) {
          hint.textContent = '长时间未点亮：低端设备/软件渲染下首帧可能需要数分钟；可尝试关闭其他标签页，或换用性能更好的设备。';
          hint.style.display = 'block';
        } else if (sec > 45) {
          hint.textContent = '低性能设备首次启动可能需要 1~3 分钟，请耐心等待。';
          hint.style.display = 'block';
        }
      }
      function hide() {
        if (!fb.hasAttribute('hidden')) {
          fb.setAttribute('hidden', '');
          if (timer) { clearInterval(timer); timer = null; }
        }
      }
      function tick() {
        if (fb.hasAttribute('hidden')) return;
        var sec = Math.round((Date.now() - t0) / 1000);
        elapsed.textContent = fmt(sec);
        showHint(sec);
        var ratio = pixelBroken ? null : litRatio();
        if (ratio != null && ratio > 0.005) {
          litStreak++;
        } else if (ratio != null) {
          litStreak = 0;
        }
        if (litStreak >= 2) {
          barInner.style.width = '100%';
          setPhase('画面已点亮', 100);
          setTimeout(hide, 350);
          return;
        }
        var vm = window.vm;
        var realPct = null;
        if (vm) {
          var p = readVar('渲染的进度');
          var total = readVar('渲染数');
          if (p !== null && total !== null && +total > 0) {
            realPct = Math.max(0, Math.min(100, Math.round((+p) / (+total) * 100)));
          }
        }
        if (realPct !== null && realPct >= 100) {
          fullStreak++;
        } else {
          fullStreak = 0;
        }
        // 收层通道②：真实进度满后持续 ~4s（开机动画即将开始）→ 退场
        if (fullStreak >= 4) {
          barInner.style.width = '100%';
          setPhase('画面已就绪', 100);
          setTimeout(hide, 350);
          return;
        }
        if (!vm) {
          setPhase('运行时启动中…', Math.min(10, 2 + sec * 0.1));
        } else if (realPct !== null) {
          // 数据源①（优先）：真实变量驱动——进度条显示「渲染的进度/渲染数」实测百分比
          setPhase('正在渲染桌面 ' + realPct + '%…（非下载；首次启动需渲染，之后更快）', Math.max(4, realPct));
        } else {
          var rt = vm.runtime;
          var targets = rt && rt.targets ? rt.targets.length : 0;
          var threads = rt && rt.threads ? rt.threads.length : 0;
          if (threads > 0) runningSeen = true;
          if (targets === 0) {
            setPhase('运行时启动中…', 12);
          } else if (targets < 3) {
            setPhase('装载舞台与角色…', 26);
          } else if (!runningSeen) {
            setPhase('编译工程数据…', 46);
          } else {
            setPhase('渲染首帧…', Math.min(92, 62 + sec * 0.4));
          }
          // 收层通道③：像素检测通道失效时，运行线程已启动且超过 100 秒 → 放行（宁早勿挂死）
          if (pixelBroken && runningSeen && sec > 100) hide();
        }
        // 全局兜底（对侧 v1.05 口径）：任何渲染栈下反馈层都不允许超过 180 秒
        if (sec > 180) hide();
      }
      var obs = new MutationObserver(function () {
        if (!errorScreen.hasAttribute('hidden')) { hide(); return; }
        if (launch.hasAttribute('hidden') && !t0) {
          t0 = Date.now();
          litStreak = 0;
          fullStreak = 0;
          runningSeen = false;
          pixelBroken = false;
          fb.removeAttribute('hidden');
          barInner.style.width = '4%';
          tick();
          timer = setInterval(tick, 1000);
        }
      });
      obs.observe(launch, { attributes: true, attributeFilter: ['hidden'] });
      obs.observe(errorScreen, { attributes: true, attributeFilter: ['hidden'] });
    })();
  <script>
    /* v1.10 动画连贯性升级（R131 · 「打开/关闭动画中间不连贯」修复）
       诊断（scripts/anim-probe.py 逐帧 trace + project.json 积木链路精读 + 打包 app 实测）：
       打开/关闭动画 = cropURL 61 张预渲染裁切皮肤逐 tick 换肤（lmsSkins_setSkin）
       + 逐 tick 指数逼近运动，全部由 VM tick 驱动；打包 app 原生 setFramerate(120)
       （lib/pixel-xxl-app.js 实测，ANALYSIS §2 历史文档漏记），而大多数设备屏幕为 60Hz：
       TurboWarp 插值只平滑运动，**换肤不可插值**——120 tick/s 下每显示帧跨 2 tick，
       约一半皮肤状态从未上屏；中段裁切增量最快（每张 5~6px）且指数速度峰值处一 tick
       跳多张皮肤，每显示帧合并 4~6 张 ⇒ 用户感知「中间不连贯」（首尾慢/快段不明显）。
       素材 fetch（动画窗口 0 次）、#boot-feedback（收层后定时器已清）、
       cropURL_crop（全部开机预渲染）均已实测排除。
       机制：缺省自适应——vm 就绪后实测 rAF 刷新率，帧率吸附到最近档 [60/90/120]
       （实测不可用时底线 60），使每 tick 换肤都能上屏；120Hz 屏保持原生 120 零变化。
       覆写夺回守卫：打包 app 初始化晚于 window.vm 可见且会一次性 setFramerate(120)，
       监听 FRAMERATE_CHANGED 立即夺回（上限 5 次）；看门狗内部变更打 internal 标志不自挬。
       ?fps=N(10~120) 显式指定、?fps=orig 完全不动（双版对比回归通道）；
       弱机看门狗（仅缺省路径）：滚动 240 tick 中位间隔 >1.6× 帧预算时一次性降半档
       （120→60 / 60→30，下限 30），显式指定豁免。
       红线：core/app 逐字节零触碰；本块为尾部追加（v1.03 SW 注册 / v1.06 反馈层先例同律）。 */
    (function () {
      'use strict';
      function qsFps() {
        try {
          var m = new URLSearchParams(location.search).get('fps');
          if (m === null || m === '') return null;            // 缺省 → 自适应刷新率 + 看门狗
          if (m === 'orig') return 'orig';                    // 完全不动（回归基线通道）
          var n = Math.floor(+m);
          if (isFinite(n) && n >= 10 && n <= 120) return n;   // 显式指定 → 尊重 + 看门狗豁免
          return null;
        } catch (e) { return null; }
      }
      var wanted = qsFps();
      if (wanted === 'orig') {
        console.info('[pixel-xxl] fps=orig（保持打包原始 120fps 节奏，回归基线通道）');
        return;
      }
      var applied = false, measuring = false, times = [], degraded = false;
      var target = 0, reapplyCount = 0, internal = false;
      // 覆写夺回守卫：打包 app 初始化期会一次性 setFramerate(120)（晚于 window.vm 可见），
      // 监听 FRAMERATE_CHANGED，检测到非本方/非看门狗变更时立即恢复目标值（上限 5 次防死循环）
      function installGuard(vm) {
        try {
          if (!vm.runtime || typeof vm.runtime.on !== 'function') return;
          vm.runtime.on('FRAMERATE_CHANGED', function (fr) {
            if (degraded || internal) return;
            if (fr === target) return;
            if (reapplyCount >= 5) return;
            reapplyCount++;
            applyFps(vm, target);
            console.info('[pixel-xxl] 覆写夺回：检测到外部 setFramerate(' + fr + ')，恢复目标 ' + target + '（第 ' + reapplyCount + ' 次）');
          });
        } catch (e) {}
      }
      function applyFps(vm, t) {
        internal = true;
        try {
          vm.setFramerate(t);
          if (typeof vm.setInterpolation === 'function') vm.setInterpolation(true);
        } finally { internal = false; }
      }
      function armWatchdog(vm, tgt) {
        if (measuring) return;
        measuring = true;
        try {
          var rt = vm.runtime;
          if (!rt || typeof rt._step !== 'function') return;
          var origStep = rt._step.bind(rt);
          var budget = 1000 / tgt * 1.6; // 允许 60% 超载余量
          rt._step = function () {
            var t = performance.now();
            var r = origStep();
            if (!degraded) {
              times.push(t);
              if (times.length > 241) times.shift();
              if (times.length >= 241) {
                var gaps = [];
                for (var i = 1; i < times.length; i++) gaps.push(times[i] - times[i - 1]);
                gaps.sort(function (a, b) { return a - b; });
                var med = gaps[Math.floor(gaps.length / 2)];
                if (med > budget) {
                  degraded = true;
                  var half = Math.max(30, Math.floor(tgt / 2));
                  try {
                    vm.setFramerate(half);
                    console.info('[pixel-xxl] 弱机降级：tick 中位 ' + Math.round(med) + 'ms > 预算 ' + Math.round(budget) + 'ms，帧率一次性降半档 ' + tgt + '→' + half);
                  } catch (e) {}
                } else {
                  times = times.slice(-121); // 达标则收缩窗口继续观察，避免误降
                }
              }
            }
            return r;
          };
        } catch (e) { console.warn('[pixel-xxl] watchdog arm failed:', e); }
      }
      // 实测显示刷新率：采 40 个 rAF 间隔取中位数，吸附到最近档 [60/90/120]，下限 60
      function measureDisplayHz(done) {
        var deltas = [], last = null, n = 0;
        function tick(t) {
          if (last !== null) { deltas.push(t - last); n++; }
          last = t;
          if (n < 40) { requestAnimationFrame(tick); return; }
          deltas.sort(function (a, b) { return a - b; });
          var med = deltas[Math.floor(deltas.length / 2)];
          var hz = med > 0 ? 1000 / med : 60;
          var snap = [60, 90, 120];
          var best = 60, bd = 1e9;
          for (var i = 0; i < snap.length; i++) {
            var d = Math.abs(snap[i] - hz);
            if (d < bd) { bd = d; best = snap[i]; }
          }
          done(Math.max(60, best));
        }
        try { requestAnimationFrame(tick); } catch (e) { done(60); }
      }
      function applyWhenReady(tries) {
        if (applied) return;
        var vm = window.vm;
        if (vm && typeof vm.setFramerate === 'function' && vm.runtime) {
          applied = true; // 防重入（自适应测量异步，只应用一次）
          var proceed = function (tgt) {
            target = tgt;
            try {
              installGuard(vm); // 先装守卫再应用：app 覆写若落在窗口内也能夺回
              applyFps(vm, tgt);
              console.info('[pixel-xxl] framerate=' + tgt + '（动画连贯性升级 v1.10：帧率自适应匹配刷新率，换肤逐 tick 上屏；?fps=orig 可回原始 120fps 节奏）');
              if (!wanted) armWatchdog(vm, tgt); // 仅缺省路径启用弱机降级
            } catch (e) { console.warn('[pixel-xxl] framerate apply failed:', e); }
          };
          if (wanted) { proceed(wanted); }
          else {
            // 后台标签页 rAF 暂停会让刷新率测量卡死：3s 超时兜底 60（双 settled 防双应用）
            var settledHz = false;
            var fin = function (hz) { if (!settledHz) { settledHz = true; proceed(hz); } };
            try { measureDisplayHz(fin); setTimeout(function () { fin(60); }, 3000); }
            catch (e) { fin(60); }
          }
          return;
        }
        if (tries > 0) setTimeout(function () { applyWhenReady(tries - 1); }, 500);
      }
      applyWhenReady(600); // vm 可能晚于本脚本就绪：最长轮询 5 分钟
    })();
  </script>
</body>
</html>
