  <title>Pixel XXL</title>
  <style>
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    :root, body.is-fullscreen {
      background-color: #000000;
    }
    [hidden] {
      display: none !important;
    }
    h1 {
      font-weight: normal;
    }
    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    #app, #loading, #error, #launch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000000;
    }
    #launch {
      background-color: rgba(0, 0, 0, 0.7);
      cursor: pointer;
    }
    .green-flag {
      width: 80px;
      height: 80px;
      padding: 16px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 3px solid hsla(0, 100%, 100%, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    #loading {
      
    }
    .progress-bar-outer {
      border: 1px solid currentColor;
      height: 10px;
      width: 200px;
      max-width: 200px;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background-color: currentColor;
    }
    .loading-text, noscript {
      font-weight: normal;
      font-size: 36px;
      margin: 0 0 16px;
    }
    .loading-image {
      margin: 0 0 16px;
    }
    #error-message, #error-stack {
      font-family: monospace;
      max-width: 600px;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
    #error-stack {
      text-align: left;
      max-height: 200px;
      overflow: auto;
    }
    .control-button {
      width: 2rem;
      height: 2rem;
      padding: 0.375rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
    }
    .control-button-highlight:hover {
      background: #ff4c4c26;
    }
    .control-button-highlight.active {
      background: #ff4c4c59;
    }
    .fullscreen-button {
      background: white;
    }
    .standalone-fullscreen-button {
      position: absolute;
      top: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 0 0 0 4px;
      padding: 4px;
      cursor: pointer;
    }
    .sc-canvas {
      cursor: auto;
    }
    .sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color {
      background-color: #ff8c1a;
    }
    .sc-monitor-row-value-outer {
      background-color: #fc662c;
    }
    .sc-monitor-row-value-editing .sc-monitor-row-value-outer {
      background-color: #e25b27;
    }
    #boot-hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.72);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
    }
    
  </style>
  <meta name="theme-color" content="#000000">

<body>
  <div id="app"></div>

  <div id="launch" class="screen" hidden title="Click to start">
    <div class="green-flag">
      <svg viewBox="0 0 16.63 17.5" width="42" height="44">
        <defs><style>.cls-1,.cls-2{fill:#4cbf56;stroke:#45993d;stroke-linecap:round;stroke-linejoin:round;}.cls-2{stroke-width:1.5px;}</style></defs>
        <path class="cls-1" d="M.75,2A6.44,6.44,0,0,1,8.44,2h0a6.44,6.44,0,0,0,7.69,0V12.4a6.44,6.44,0,0,1-7.69,0h0a6.44,6.44,0,0,0-7.69,0"/>
        <line class="cls-2" x1="0.75" y1="16.75" x2="0.75" y2="0.75"/>
      </svg>
    </div>
  </div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>
    
    
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>

  <div id="boot-hint" hidden>首次启动需要准备素材与桌面，请稍候…（已下载过的设备走本地缓存，更快）</div>

  <script src="lib/turbowarp-core.js"></script>
<script src="lib/pixel-xxl-app.js"></script>
<script src="lib/project-loader.js"></script>
<script>
    const run = async () => {
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      setProgress(1);
      loadingScreen.hidden = true;
      if (false) {
        scaffolding.start();
      } else {
        launchScreen.hidden = false;
        launchScreen.addEventListener('click', () => {
          launchScreen.hidden = true;
          scaffolding.start();
        });
        launchScreen.focus();
      }
    };
    run().catch(handleError);
  </script>
  <script>
    // v1.03: Service Worker 缓存层注册（素材 md5 命名=内容不可变 → cache-first；
    // 壳层 stale-while-revalidate；详见 sw.js 与 docs/PORTING.md）
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    // v1.04: 启动空窗提示（docs/MOBILE.md 修复路线 #4）——点击启动后画布有一段
    // 壁纸取色/云母/预渲染的主线程空窗（黑屏、输入被吞）。壳层加一枚不拦截点击
    // （pointer-events:none）的提示；画布出现亮帧即隐藏。WebGL 上下文无
    // preserveDrawingBuffer，采样不可靠时以 20s 封顶兜底。
    (function () {
      var hint = document.getElementById('boot-hint');
      if (!hint) return;
      var shown = false;
      var ticks = 0;
      var timer = null;
      function hide() {
        if (timer) { clearInterval(timer); timer = null; }
        hint.style.opacity = '0';
        setTimeout(function () { hint.hidden = true; }, 450);
      }
      function sample() {
        ticks++;
        try {
          var canvas = document.querySelector('#app canvas');
          if (canvas && canvas.width) {
            var s = document.createElement('canvas');
            s.width = 24;
            s.height = 24;
            var ctx = s.getContext('2d');
            ctx.drawImage(canvas, 0, 0, 24, 24);
            var d = ctx.getImageData(0, 0, 24, 24).data;
            var lit = 0;
            for (var i = 0; i < d.length; i += 4) {
              if (d[i + 3] > 8 && d[i] + d[i + 1] + d[i + 2] > 24) lit++;
            }
            if (lit > 8) { hide(); return; }
          }
        } catch (e) { /* 采样失败按超时兜底 */ }
        if (ticks >= 66) { hide(); } // 300ms × 66 ≈ 20s 封顶
      }
      document.getElementById('launch').addEventListener('click', function () {
        if (shown) return;
        shown = true;
        hint.hidden = false;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { hint.style.opacity = '1'; });
        });
        timer = setInterval(sample, 300);
      });
    })();
  </script>
</body>
