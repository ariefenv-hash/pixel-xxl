<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- We only include this to explicitly loosen the CSP of various packager environments. It does not provide any security. -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>Pixel XXL</title>
  <style>
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    :root, body.is-fullscreen {
      background-color: #000000;
    }
    [hidden] {
      display: none !important;
    }
    h1 {
      font-weight: normal;
    }
    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    #app, #loading, #error, #launch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000000;
    }
    #launch {
      background-color: rgba(0, 0, 0, 0.7);
      cursor: pointer;
    }
    .green-flag {
      width: 80px;
      height: 80px;
      padding: 16px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 3px solid hsla(0, 100%, 100%, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    #loading {
      
    }
    .progress-bar-outer {
      border: 1px solid currentColor;
      height: 10px;
      width: 200px;
      max-width: 200px;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background-color: currentColor;
    }
    .loading-text, noscript {
      font-weight: normal;
      font-size: 36px;
      margin: 0 0 16px;
    }
    .loading-image {
      margin: 0 0 16px;
    }
    #error-message, #error-stack {
      font-family: monospace;
      max-width: 600px;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
    #error-stack {
      text-align: left;
      max-height: 200px;
      overflow: auto;
    }
    .control-button {
      width: 2rem;
      height: 2rem;
      padding: 0.375rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
    }
    .control-button-highlight:hover {
      background: #ff4c4c26;
    }
    .control-button-highlight.active {
      background: #ff4c4c59;
    }
    .fullscreen-button {
      background: white;
    }
    .standalone-fullscreen-button {
      position: absolute;
      top: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 0 0 0 4px;
      padding: 4px;
      cursor: pointer;
    }
    .sc-canvas {
      cursor: auto;
    }
    .sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color {
      background-color: #ff8c1a;
    }
    .sc-monitor-row-value-outer {
      background-color: #fc662c;
    }
    .sc-monitor-row-value-editing .sc-monitor-row-value-outer {
      background-color: #e25b27;
    }
    #boot-hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.72);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
    }
    #boot-hint-barwrap {
      display: block;
      margin: 6px auto 0;
      height: 4px;
      width: 180px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }
    #boot-hint-bar {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 2px;
      background: #fff;
      transition: width 0.3s;
    }
    /* v1.06: 加载屏状态文案（首次下载 / 本地素材库载入 / 解码中） */
    #loading-note {
      position: absolute;
      bottom: 26px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      line-height: 1.5;
      padding: 0 24px;
    }
    
  </style>
  <meta name="theme-color" content="#000000">
  
</head>
<body>
  <div id="app"></div>

  <div id="launch" class="screen" hidden title="Click to start">
    <div class="green-flag">
      <svg viewBox="0 0 16.63 17.5" width="42" height="44">
        <defs><style>.cls-1,.cls-2{fill:#4cbf56;stroke:#45993d;stroke-linecap:round;stroke-linejoin:round;}.cls-2{stroke-width:1.5px;}</style></defs>
        <path class="cls-1" d="M.75,2A6.44,6.44,0,0,1,8.44,2h0a6.44,6.44,0,0,0,7.69,0V12.4a6.44,6.44,0,0,1-7.69,0h0a6.44,6.44,0,0,0-7.69,0"/>
        <line class="cls-2" x1="0.75" y1="16.75" x2="0.75" y2="0.75"/>
      </svg>
    </div>
  </div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>
    <div id="loading-note"></div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>

  <div id="boot-hint" hidden>
    <span id="boot-hint-text">正在准备素材与桌面…</span>
    <span id="boot-hint-barwrap"><span id="boot-hint-bar"></span></span>
  </div>

  <script src="lib/turbowarp-core.js"></script>
<script src="lib/pixel-xxl-app.js"></script>
<script src="lib/project-loader.js"></script>
<script>
    const run = async () => {
      // v1.06: 加载屏状态文案——轮询 loader 的 __packState()，区分
      // 「首次下载中 X% / 本地素材库载入 / 逐文件兜底 / 解码中」四态，
      // 并为素材解码段（进度条 0.75→1.0，vm 内部解码、无细分进度事件）给出诚实预期
      var noteEl = document.getElementById('loading-note');
      var setNote = function (t) { if (noteEl) noteEl.textContent = t; };
      setNote('正在准备素材…');
      var noteTimer = setInterval(function () {
        var st = null;
        try { st = window.__packState ? window.__packState() : null; } catch (e) {}
        if (!st) return;
        if (st.ready) {
          // v1.07: 包就绪后展示真实解码进度（assetLoaded/assetTotal），
          // 解码完后进入构建桌面长尾段（vm.loadProject，无细分事件）
          var a = st.assets || null;
          if (a && a.total > 0 && a.loaded < a.total) {
            setNote((st.source === 'idb' ? '已从本地素材库载入素材包，' : '素材包就绪，') +
              '解码素材 ' + Math.min(100, Math.round(a.loaded / a.total * 100)) + '%…');
          } else {
            clearInterval(noteTimer);
            setNote(st.source === 'idb'
              ? '已从本地素材库载入素材包，正在构建桌面…'
              : '素材包就绪，正在构建桌面…');
          }
        } else if (st.failed) {
          clearInterval(noteTimer);
          setNote('正在加载素材（逐文件模式，稍慢）…');
        } else if (st.total > 0) {
          var pct = Math.min(100, Math.round(st.loaded / st.total * 100));
          setNote('首次进入需要下载素材包（约 22 MB），完成后会保存在本地，再次进入无需重复下载… ' + pct + '%');
        }
      }, 400);
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      clearInterval(noteTimer);
      setProgress(1);
      loadingScreen.hidden = true;
      if (false) {
        scaffolding.start();
      } else {
        launchScreen.hidden = false;
        launchScreen.addEventListener('click', () => {
          launchScreen.hidden = true;
          scaffolding.start();
        });
        launchScreen.focus();
      }
    };
    run().catch(handleError);
  </script>
  <script>
    // v1.03: Service Worker 缓存层注册（素材 md5 命名=内容不可变 → cache-first；
    // 壳层 stale-while-revalidate；详见 sw.js 与 docs/PORTING.md）
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    // v1.05: 启动进度提示条（docs/MOBILE.md 修复路线 #4 壳层完整版）——点击启动后有
    // 壁纸取色/云母/预渲染的主线程空窗（黑屏、输入被吞）。此条 pointer-events:none
    // 不拦截点击；进度读取运行时 Scratch 变量「渲染的进度/渲染数」（window.vm 全局
    // 可查，不触碰 app 层逐字节红线）；画布亮帧（开机动画开始）或进度满 ~4s 后隐藏，
    // 180s 硬封顶。WebGL 无 preserveDrawingBuffer，亮帧采样不可靠时由进度/封顶兜底。
    (function () {
      var hint = document.getElementById('boot-hint');
      var textEl = document.getElementById('boot-hint-text');
      var barEl = document.getElementById('boot-hint-bar');
      if (!hint) return;
      var shown = false;
      var ticks = 0;
      var fullTicks = 0;
      var timer = null;
      function hide() {
        if (timer) { clearInterval(timer); timer = null; }
        hint.style.opacity = '0';
        setTimeout(function () { hint.hidden = true; }, 450);
      }
      function readVar(name) {
        try {
          if (!window.vm || !vm.runtime) return null;
          var stage = vm.runtime.getTargetForStage();
          if (!stage || !stage.variables) return null;
          for (var k in stage.variables) {
            var v = stage.variables[k];
            if (v && v.name === name) return v.value;
          }
        } catch (e) {}
        return null;
      }
      function canvasLit() {
        try {
          var canvas = document.querySelector('#app canvas');
          if (!canvas || !canvas.width) return false;
          var s = document.createElement('canvas');
          s.width = 24;
          s.height = 24;
          var ctx = s.getContext('2d');
          ctx.drawImage(canvas, 0, 0, 24, 24);
          var d = ctx.getImageData(0, 0, 24, 24).data;
          var lit = 0;
          for (var i = 0; i < d.length; i += 4) {
            if (d[i + 3] > 8 && d[i] + d[i + 1] + d[i + 2] > 24) lit++;
          }
          return lit > 8;
        } catch (e) { return false; }
      }
      function sample() {
        ticks++;
        if (canvasLit()) { hide(); return; } // 开机动画开始 ⇒ 空窗结束
        var p = readVar('渲染的进度');
        var total = readVar('渲染数');
        if (p !== null && total !== null && +total > 0) {
          var pct = Math.max(0, Math.min(100, Math.round((+p) / (+total) * 100)));
          if (barEl) barEl.style.width = pct + '%';
          if (textEl) textEl.textContent = '正在渲染桌面 ' + pct + '%…（非下载；首次启动需渲染，之后更快）';
          fullTicks = pct >= 100 ? fullTicks + 1 : 0;
          if (fullTicks >= 14) { hide(); return; } // 进度满后 ~4s 退场
        }
        if (ticks >= 600) hide(); // 300ms × 600 ≈ 180s 硬封顶
      }
      document.getElementById('launch').addEventListener('click', function () {
        if (shown) return;
        shown = true;
        hint.hidden = false;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { hint.style.opacity = '1'; });
        });
        timer = setInterval(sample, 300);
      });
    })();
  </script>
</body>
</html>
