      <symbol id="ic-add" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
      <symbol id="ic-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
      <symbol id="ic-delete" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
      <symbol id="ic-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
      <symbol id="ic-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10z"/></symbol>
    </svg>

    <!-- ================= 设备 ================= -->
    <div class="stage">
      <div class="device" id="device">
        <div class="screen" id="screen">
          <!-- 壁纸：LQIP 先铺，JS 就绪后换高清 -->
          <div class="wallpaper" id="wallpaper" data-wallpaper="w3"></div>
          <div class="wallpaper__scrim" id="wallpaperScrim"></div>

          <!-- ========== 桌面 ========== -->
          <section class="desktop" id="desktop" aria-label="桌面">
            <!-- 小组件：原工程「时钟」是 2×2 模拟表盘 + 一个数字世界钟，点开走组件专属时间轴 -->
            <div class="desktop__widgets" id="desktopWidgets">
              <button class="widget widget--clock" data-app="clock" type="button" aria-label="时钟小组件">
                <div class="widget__face" aria-hidden="true">
                  <span class="clock-hand clock-hand--hour" id="wHour"></span>
                  <span class="clock-hand clock-hand--minute" id="wMinute"></span>
                  <span class="clock-hand clock-hand--second" id="wSecond"></span>
                  <span class="clock-pin"></span>
                </div>
                <div class="widget__meta">
                  <span class="widget__date" id="wDate">11月14日 周六</span>
                  <span class="widget__city">本地时间</span>
                </div>
              </button>

              <button class="widget widget--world" data-app="clock" type="button" aria-label="世界时钟小组件">
                <span class="widget__bigtime" id="wWorldTime">15:51</span>
                <div class="widget__cities">
                  <span><i>北京</i><b data-offset="0">15:51</b></span>
                  <span><i>伦敦</i><b data-offset="-8">07:51</b></span>
                  <span><i>纽约</i><b data-offset="-13">02:51</b></span>
                </div>
              </button>
            </div>

            <div class="desktop__grid" id="desktopGrid">
              <button class="icon" data-app="settings" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-settings" /></svg></span>
                <span class="icon__label">设置</span>
              </button>
              <button class="icon" data-app="photos" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-photos" /></svg></span>
                <span class="icon__label">相册</span>
              </button>
              <button class="icon" data-app="store" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-store" /></svg></span>
                <span class="icon__label">商店</span>
              </button>
              <button class="icon" data-app="notifications" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-notifications" /></svg></span>
                <span class="icon__label">通知</span>
              </button>
              <button class="icon" data-app="video" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-video" /></svg></span>
                <span class="icon__label">视频</span>
              </button>
              <button class="icon" data-app="bilibili" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-bilibili" /></svg></span>
                <span class="icon__label">bilibili</span>
              </button>
              <button class="icon" data-app="theme" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-palette" /></svg></span>
                <span class="icon__label">个性化</span>
              </button>
              <button class="icon" data-app="music" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-music" /></svg></span>
                <span class="icon__label">音乐</span>
              </button>
              <button class="icon" data-app="calculator" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-calculator" /></svg></span>
                <span class="icon__label">计算器</span>
              </button>
              <button class="icon" data-app="clock" type="button">
                <span class="icon__tile"><svg class="icon__svg"><use href="#ic-clock" /></svg></span>
                <span class="icon__label">时钟</span>
              </button>
            </div>

            <nav class="dock" id="dock" aria-label="Dock">
              <button class="dock__icon" data-app="phone" type="button" aria-label="电话">
                <svg class="icon__svg"><use href="#ic-phone" /></svg>
              </button>
              <button class="dock__icon" data-app="message" type="button" aria-label="信息">
                <svg class="icon__svg"><use href="#ic-message" /></svg>
              </button>
              <button class="dock__icon" data-app="browser" type="button" aria-label="Chrome">
                <svg class="icon__svg"><use href="#ic-browser" /></svg>
              </button>
              <button class="dock__icon" data-app="camera" type="button" aria-label="相机">
                <svg class="icon__svg"><use href="#ic-camera" /></svg>
              </button>
            </nav>
          </section>

          <!-- ========== All Apps 抽屉 ========== -->
          <section class="drawer" id="drawer" aria-hidden="true" aria-label="全部应用">
            <div class="drawer__bg"></div>
            <div class="drawer__panel">
              <div class="drawer__top">
                <label class="drawer__search">
                  <svg aria-hidden="true"><use href="#ic-search" /></svg>
                  <input id="drawerSearch" type="search" placeholder="搜索应用" autocomplete="off" />
                </label>
              </div>
              <div class="drawer__grid" id="drawerGrid"></div>
            </div>
          </section>

          <!-- 手势导航条：navigation_home_handle_width 108dp / radius 2dp -->
          <div class="home-handle" aria-hidden="true"></div>

          <!-- ========== app 窗口层 ========== -->
          <main class="app-layer" id="appLayer" aria-live="polite"></main>

          <!-- ========== Recents ========== -->
          <section class="recents" id="recents" hidden aria-label="最近任务">
            <div class="recents__track" id="recentsTrack"></div>
            <p class="recents__empty">没有最近的应用</p>
          </section>

          <!-- ========== 通知中心 ========== -->
          <section class="shade" id="shade" aria-hidden="true">
            <div class="shade__scrim" data-dismiss></div>
            <div class="shade__panel">
              <header class="shade__header">
                <div class="shade__clock">
                  <span class="shade__time" id="shadeTime">09:41</span>
                  <span class="shade__date" id="shadeDate">11月14日 周五</span>
                </div>
                <div class="shade__actions">
                  <button class="chip" id="shadeSettings" type="button" aria-label="设置">
                    <svg><use href="#ic-settings" /></svg>
                  </button>
                  <button class="chip" id="shadePower" type="button" aria-label="关机">
                    <svg><use href="#ic-power" /></svg>
                  </button>
                </div>
              </header>

              <div class="shade__quick">
                <div class="quick__grid" id="shadeQuickGrid"></div>
              </div>

              <div class="shade__notifs" id="shadeList"></div>

              <footer class="shade__footer">
                <button class="text-btn" id="clearAll" type="button">
                  <svg><use href="#ic-clear-all" /></svg> 清除全部
                </button>
              </footer>
            </div>
          </section>

          <!-- ========== 控制中心 ========== -->
          <section class="qs" id="qs" aria-hidden="true">
            <div class="qs__scrim" data-dismiss></div>
            <div class="qs__panel">
              <header class="qs__header">
                <button class="chip" id="qsBack" type="button" aria-label="收起">
                  <svg><use href="#ic-arrow-down" /></svg>
                </button>
                <div class="qs__tools">
                  <button class="chip" id="qsSettings" type="button" aria-label="设置">
                    <svg><use href="#ic-settings" /></svg>
                  </button>
                  <button class="chip" id="qsEdit" type="button" aria-label="编辑磁贴">
                    <svg><use href="#ic-edit" /></svg>
                  </button>
                  <button class="chip" id="qsPower" type="button" aria-label="关机">
                    <svg><use href="#ic-power" /></svg>
                  </button>
                </div>
              </header>

              <div class="qs__sliders">
                <div class="slider slider--brightness" id="brightnessSlider">
                  <svg class="slider__icon"><use href="#ic-brightness" /></svg>
                  <div class="slider__track"><div class="slider__fill" id="brightnessFill"></div></div>
                </div>
                <div class="slider slider--volume" id="volumeSlider">
                  <svg class="slider__icon"><use href="#ic-volume" /></svg>
                  <div class="slider__track"><div class="slider__fill" id="volumeFill"></div></div>
                </div>
              </div>

              <div class="qs__grid" id="qsGrid"></div>

              <footer class="qs__footer">
                <button class="chip chip--round" id="qsNotifBtn" type="button" aria-label="通知">
                  <svg><use href="#ic-notifications" /></svg>
                </button>
                <div class="qs__footer-right">
                  <button class="chip chip--round" id="qsSettingsBtn" type="button" aria-label="设置">
                    <svg><use href="#ic-settings" /></svg>
                  </button>
                  <button class="chip chip--round" id="qsPowerBtn" type="button" aria-label="关机">
                    <svg><use href="#ic-power" /></svg>
                  </button>
                </div>
              </footer>
            </div>
          </section>

          <!-- ========== 锁屏 ========== -->
          <section class="lockscreen" id="lockscreen" aria-label="锁屏">
            <div class="lock__clock">
              <span class="lock__time" id="lockTime">09:41</span>
              <span class="lock__date" id="lockDate">11月14日 周五</span>
            </div>
            <div class="lock__hint">
              <svg><use href="#ic-lock" /></svg>
              <span>上滑解锁</span>
            </div>
          </section>

          <!-- ========== 状态栏 ========== -->
          <div class="statusbar" id="statusbar">
            <div class="statusbar__left">
              <span class="statusbar__time" id="statusTime">09:41</span>
              <span class="statusbar__notif" id="statusNotif">
                <svg><use href="#ic-notifications" /></svg>
              </span>
            </div>
            <div class="statusbar__right">
              <svg class="statusbar__icon" id="sbBt" hidden><use href="#ic-bluetooth" /></svg>
              <svg class="statusbar__icon"><use href="#ic-signal" /></svg>
              <svg class="statusbar__icon" id="sbWifi"><use href="#ic-wifi" /></svg>
              <span class="statusbar__battery" id="sbBattery"><i></i></span>
            </div>
          </div>

          <div class="toast" id="toast" role="status"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
