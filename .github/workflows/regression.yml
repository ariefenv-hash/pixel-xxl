name: regression

# v2 门禁（#35）：
#   gates  → 类型检查 + 构建 + 首屏性能门禁（4G / 4x CPU 实测，超预算即红）
#   deploy → main 分支构建并发布到 GitHub Pages
#
# 与 v1 的差别：不再有 Scratch 运行时的 pack-verify / shell-probe / boot-feedback
# 三条链路（运行时已被移除），取而代之的是「首屏预算」这一条硬闸——它是 v2 唯一
# 真正在乎的指标，所以必须由 CI 每个 push 都量一遍。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 安装 Playwright（性能门禁需要真浏览器）
        run: |
          python3 -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 首屏性能门禁（可交互 < 1s / FCP < 1.5s / 传输 < 200KB）
        run: python3 scripts/perf-gate.py --json dist/perf.json

      - name: 证据 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-evidence
          path: dist/perf.json
          retention-days: 30

      - name: 失败回帖（红灯自动登记到 #35）
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 35 -R ${{ github.repository }} \
            -b "CI 红灯：${{ github.sha }} 的首屏门禁未通过（run ${{ github.run_id }}）。详见 Actions 日志与 perf-evidence artifact。" || true

  deploy:
    needs: gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
